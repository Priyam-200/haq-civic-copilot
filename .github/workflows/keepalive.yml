# Pings the free-tier backend so it does not go to sleep between visits.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS -m 120 --retry 3 --retry-delay 20 https://haq-backend-bxxo.onrender.com/health
